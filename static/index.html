<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JackLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/css/winbox.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="desktop"></div>
    <div id="status-bar">
        <div class="status-left">
            <span class="status-item" id="status-hostname">JackLink</span>
        </div>
        <div class="status-right">
            <span class="status-item" id="status-connections">0 win</span>
            <span class="status-sep">|</span>
            <span class="status-item" id="status-vnc">VNC: -</span>
            <span class="status-sep">|</span>
            <span class="status-item" id="status-clock">--:--</span>
        </div>
    </div>
    <div id="context-menu" class="context-menu">
        <div class="context-item" data-app="terminal">&gt;_ Terminal</div>
        <div class="context-item" data-app="files">&#128193; Files</div>
        <div class="context-item" data-app="editor">&#128221; Editor</div>
        <div class="context-item" data-app="images">&#128247; Images</div>
        <div class="context-item" data-app="vnc" id="vnc-menu-item" style="display:none;">&#128421; Desktop</div>
        <div class="context-item" data-app="browser">&#127760; Browser</div>
        <div class="context-item" data-app="keepass">&#128272; KeePass</div>
        <div class="context-sep"></div>
        <div class="context-item" data-app="settings">&#9881; Settings</div>
        <div class="context-item" data-action="logout">Logout</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/argon2-browser/1.18.0/argon2-bundled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kdbxweb@2.4.0/dist/kdbxweb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script type="module" src="/static/js/desktop.js"></script>
</body>
</html>
