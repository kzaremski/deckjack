<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JackLink - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <h1>JACKLINK</h1>
            <p class="tagline">Plug in. You're home.</p>
        </div>
        <form class="login-form" action="/login" method="POST">
            <div class="input-group">
                <input type="text" name="token" placeholder="Enter token" autocomplete="off" autofocus required>
            </div>
            <button type="submit" class="btn-primary">JACK IN</button>
        </form>
        <script>
            if (window.location.search.includes('error=1')) {
                document.querySelector('.login-form').insertAdjacentHTML('beforeend',
                    '<p class="error">Invalid token. Try again.</p>');
            }
        </script>
    </div>
</body>
</html>
