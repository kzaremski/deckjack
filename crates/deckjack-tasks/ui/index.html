<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tasks</title>
    <link rel="stylesheet" href="/kit/kit.css" />
    <style>
      .add {
        display: flex;
        flex: none;
        gap: var(--dj-space-2, 0.5rem);
        padding: var(--dj-space-2, 0.5rem) var(--dj-space-3, 0.75rem);
        border-bottom: 1px solid var(--dj-color-border, #2a2e38);
      }
      .add input[type="text"] {
        flex: 1;
        min-width: 0;
      }
      .add input,
      .add select {
        padding: var(--dj-space-1, 0.25rem) var(--dj-space-2, 0.5rem);
        border: 1px solid var(--dj-color-border, #2a2e38);
        border-radius: var(--dj-radius-sm, 4px);
        background: var(--dj-color-surface, #16181d);
        color: inherit;
        font: inherit;
      }
      .tasks {
        overflow-y: auto;
        flex: 1;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .task {
        display: flex;
        gap: var(--dj-space-2, 0.5rem);
        align-items: baseline;
        padding: var(--dj-space-2, 0.5rem) var(--dj-space-3, 0.75rem);
        border-bottom: 1px solid var(--dj-color-border, #2a2e38);
      }
      .task[data-done="true"] .what {
        color: var(--dj-color-text-muted, #9aa0ad);
        text-decoration: line-through;
      }
      .what {
        flex: 1;
        min-width: 0;
        word-break: break-word;
      }
      .due,
      .pri {
        flex: none;
        color: var(--dj-color-text-muted, #9aa0ad);
        font-size: var(--dj-text-xs, 0.75rem);
        font-variant-numeric: tabular-nums;
      }
      .due[data-late="true"] {
        color: var(--dj-color-danger, #f07171);
      }
      .pri[data-high="true"] {
        color: var(--dj-color-warning, #e0af68);
      }
      .drop {
        border: 0;
        background: none;
        color: var(--dj-color-text-muted, #9aa0ad);
        font: inherit;
        cursor: pointer;
      }
      .drop:hover {
        color: var(--dj-color-danger, #f07171);
      }
    </style>
  </head>
  <body>
    <div class="dj-bar">
      <h1 class="dj-title">Tasks</h1>
      <span class="dj-spacer"></span>
      <label class="dj-row-meta">
        <input type="checkbox" id="showDone" /> Show done
      </label>
    </div>

    <form class="add" id="add">
      <input type="text" id="summary" placeholder="What needs doing?" required />
      <input type="date" id="due" title="Due date" />
      <select id="priority" title="Priority">
        <option value="0">—</option>
        <option value="1">High</option>
        <option value="5">Medium</option>
        <option value="9">Low</option>
      </select>
      <button class="dj-button" type="submit">Add</button>
    </form>

    <ul class="tasks" id="tasks"></ul>
    <p class="dj-status" id="status">Loading…</p>

    <script type="module">
      import { bus, failure, text } from "/kit/bus.js";

      const listEl = document.getElementById("tasks");
      const status = document.getElementById("status");
      const showDone = document.getElementById("showDone");

      let tasks = [];
      let unreadable = [];

      function say(message) {
        status.textContent = message;
      }

      /** `20260110` or `20260110T150000` as the file wrote it. */
      function readDue(value) {
        if (!value) return null;
        const y = Number(value.slice(0, 4));
        const m = Number(value.slice(4, 6));
        const d = Number(value.slice(6, 8));
        if (value.length === 8) return { date: new Date(y, m - 1, d), timed: false };
        const hh = Number(value.slice(9, 11));
        const mm = Number(value.slice(11, 13));
        return { date: new Date(y, m - 1, d, hh, mm), timed: true };
      }

      function showDue(value) {
        const parsed = readDue(value);
        if (!parsed) return { label: "", late: false };
        const now = new Date();
        // A date-only due is late once the day is over, not at midnight that
        // morning. Getting this wrong marks everything due today as overdue.
        const end = parsed.timed
          ? parsed.date
          : new Date(parsed.date.getFullYear(), parsed.date.getMonth(), parsed.date.getDate(), 23, 59, 59);
        const label = parsed.timed
          ? parsed.date.toLocaleString(undefined, {
              month: "short",
              day: "numeric",
              hour: "numeric",
              minute: "2-digit",
            })
          : parsed.date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        return { label, late: end < now };
      }

      function draw() {
        const visible = tasks.filter((t) => showDone.checked || !t.done);
        if (visible.length === 0) {
          listEl.innerHTML = '<li class="dj-empty">Nothing to do.</li>';
        } else {
          listEl.innerHTML = visible
            .map((t) => {
              const due = showDue(t.due);
              return `
              <li class="task" data-done="${t.done}">
                <input type="checkbox" class="tick" data-id="${text(t.id)}" ${t.done ? "checked" : ""}
                       aria-label="Done" />
                <span class="what">${text(t.summary)}</span>
                <span class="pri" data-high="${t.priority > 0 && t.priority <= 3}">${
                  t.priority > 0 ? "!".repeat(t.priority <= 3 ? 3 : t.priority <= 6 ? 2 : 1) : ""
                }</span>
                <span class="due" data-late="${due.late && !t.done}">${text(due.label)}</span>
                <button class="drop" data-id="${text(t.id)}" title="Delete">×</button>
              </li>`;
            })
            .join("");

          for (const tick of listEl.querySelectorAll(".tick")) {
            tick.addEventListener("change", async () => {
              try {
                await bus.invoke("tasks.complete", { id: tick.dataset.id, done: tick.checked });
                await refresh();
              } catch (e) {
                failure(status, e);
              }
            });
          }
          for (const drop of listEl.querySelectorAll(".drop")) {
            drop.addEventListener("click", async () => {
              // No confirmation here: `tasks.delete` is declared destructive,
              // so the shell asks, with the bus's own wording.
              try {
                await bus.invoke("tasks.delete", { id: drop.dataset.id });
                await refresh();
              } catch (e) {
                failure(status, e);
              }
            });
          }
        }

        const open = tasks.filter((t) => !t.done).length;
        let note = `${open} open, ${tasks.length - open} done`;
        if (unreadable.length > 0) {
          note += ` · ${unreadable.length} file${unreadable.length === 1 ? "" : "s"} in Tasks/ could not be read: ${unreadable.join(", ")}`;
        }
        say(note);
      }

      async function refresh() {
        const result = await bus.invoke("tasks.list");
        tasks = result.tasks ?? [];
        unreadable = result.unreadable ?? [];
        draw();
      }

      showDone.addEventListener("change", draw);

      document.getElementById("add").addEventListener("submit", async (event) => {
        event.preventDefault();
        const summary = document.getElementById("summary");
        const due = document.getElementById("due");
        const priority = document.getElementById("priority");
        if (!summary.value.trim()) return;
        try {
          await bus.invoke("tasks.add", {
            summary: summary.value,
            due: due.value || null,
            priority: Number(priority.value),
          });
          summary.value = "";
          due.value = "";
          priority.value = "0";
          await refresh();
          summary.focus();
        } catch (e) {
          failure(status, e);
        }
      });

      refresh().catch((e) => failure(document.body, e));
    </script>
  </body>
</html>
