<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Files</title>
    <link rel="stylesheet" href="/kit/kit.css" />
    <style>
      /* A path bar made of buttons, so every ancestor is one tap away. It
         scrolls rather than truncating, and never shrinks to nothing. */
      .crumbs {
        display: flex;
        flex: 1;
        overflow-x: auto;
        gap: 0.125rem;
        align-items: center;
        min-width: 4rem;
        scrollbar-width: none;
      }
      .crumb,
      .sep {
        padding: 0 0.25rem;
        border: 0;
        background: none;
        color: var(--dj-color-text-muted, #9aa0ad);
        font: inherit;
        white-space: nowrap;
      }
      .crumb {
        min-height: var(--dj-touch, 2rem);
        cursor: pointer;
      }
      .crumb:last-of-type {
        color: var(--dj-color-text, #e7e9ee);
      }
      .crumb:hover {
        color: var(--dj-color-accent, #7aa2f7);
      }

      #list {
        flex: 1;
        overflow: auto;
        outline: none;
      }
      #list .dj-row {
        min-height: var(--dj-touch, 2rem);
        user-select: none;
        -webkit-user-select: none;
        /* The long-press is ours: no callout menu, no text magnifier. */
        -webkit-touch-callout: none;
        align-items: center;
        cursor: default;
      }
      #list .dj-row[aria-selected="true"] {
        background: var(--dj-color-selection, #2d3344);
      }
      #list:focus-visible .dj-row[data-cursor] {
        outline: 1px solid var(--dj-color-accent, #7aa2f7);
        outline-offset: -1px;
      }
      .check,
      .kind {
        flex: none;
        width: 1rem;
        color: var(--dj-color-text-muted, #9aa0ad);
        text-align: center;
      }
      /* The check column only exists in selection mode, where a tap toggles
         and the operator needs to see what a tap will do. */
      #list:not([data-mode="select"]) .check {
        display: none;
      }
      .rename {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: inherit;
        background: var(--dj-color-surface, #16181d);
        border: 1px solid var(--dj-color-accent, #7aa2f7);
        border-radius: var(--dj-radius-sm, 4px);
        padding: 0 0.25rem;
      }
      #selbar[hidden],
      .dj-button[hidden] {
        display: none;
      }
      #selbar {
        flex-wrap: wrap;
        border-top: 1px solid var(--dj-color-border, #2a2e38);
        border-bottom: 0;
      }
      .foot {
        display: flex;
        flex: none;
        align-items: center;
        gap: var(--dj-space-2, 0.5rem);
      }
      .foot .dj-status {
        flex: 1;
        min-width: 0;
      }
      #undo {
        margin-right: var(--dj-space-3, 0.75rem);
      }
      #select[aria-pressed="true"] {
        color: var(--dj-color-accent, #7aa2f7);
      }

      /* Thumbnails sit where the kind glyph does, so a row is the same
         height with or without one. */
      .kind {
        width: 1.75rem;
      }
      .thumb {
        display: block;
        width: 1.75rem;
        height: 1.75rem;
        object-fit: cover;
        border-radius: var(--dj-radius-sm, 4px);
      }
      .thumb:not([src]) {
        visibility: hidden;
      }

      #tools[hidden] {
        display: none;
      }
      #tools {
        gap: var(--dj-space-2, 0.5rem);
      }
      #filter {
        flex: 1;
        min-width: 4rem;
        min-height: var(--dj-touch, 2rem);
        padding: 0 0.5rem;
        font: inherit;
        color: inherit;
        background: var(--dj-color-surface, #16181d);
        border: 1px solid var(--dj-color-border, #2a2e38);
        border-radius: var(--dj-radius-sm, 4px);
      }
      #filter:focus {
        outline: none;
        border-color: var(--dj-color-accent, #7aa2f7);
      }
      #sort {
        min-height: var(--dj-touch, 2rem);
        font: inherit;
        color: inherit;
        background: var(--dj-color-surface-raised, #1b1e25);
        border: 1px solid var(--dj-color-border, #2a2e38);
        border-radius: var(--dj-radius-sm, 4px);
      }
      #sortdir {
        min-width: var(--dj-touch, 2rem);
      }

      /* A folder a drag would drop into. */
      #list .dj-row[data-drop],
      .crumb[data-drop] {
        outline: 2px solid var(--dj-color-accent, #7aa2f7);
        outline-offset: -2px;
        background: var(--dj-color-selection, #2d3344);
      }
      #list[data-dragging] {
        cursor: grabbing;
      }
      #ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 20;
        pointer-events: none;
        padding: var(--dj-space-1, 0.25rem) var(--dj-space-2, 0.5rem);
        border-radius: var(--dj-radius-sm, 4px);
        background: var(--dj-color-accent, #7aa2f7);
        color: var(--dj-color-surface, #16181d);
        font-size: var(--dj-text-xs, 0.75rem);
        white-space: nowrap;
      }
      #ghost[hidden],
      #menu[hidden] {
        display: none;
      }

      #menu {
        position: fixed;
        z-index: 10;
        display: flex;
        flex-direction: column;
        min-width: 11rem;
        max-width: calc(100vw - 8px);
        padding: var(--dj-space-1, 0.25rem) 0;
        border: 1px solid var(--dj-color-border, #2a2e38);
        border-radius: var(--dj-radius-sm, 4px);
        background: var(--dj-color-surface-raised, #1b1e25);
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.35);
      }
      .menu-item {
        min-height: var(--dj-touch, 2rem);
        padding: 0 var(--dj-space-3, 0.75rem);
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .menu-item:hover,
      .menu-item:focus-visible {
        outline: none;
        background: var(--dj-color-surface-hover, #21242c);
      }

      #space {
        flex: none;
        padding: 0 var(--dj-space-3, 0.75rem);
        color: var(--dj-color-text-muted, #9aa0ad);
        font-size: var(--dj-text-xs, 0.75rem);
        white-space: nowrap;
      }
      #space[data-low] {
        color: var(--dj-color-danger, #f7768e);
      }
    </style>
  </head>
  <body>
    <div class="dj-bar">
      <button class="dj-button" id="up" title="Up one folder (Backspace)" aria-label="Up one folder">↑</button>
      <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
      <button class="dj-button" id="paste" hidden title="Paste (Ctrl+V)"></button>
      <button class="dj-button" id="select" aria-pressed="false" title="Select several">Select</button>
      <button class="dj-button" id="mkdir">New folder</button>
      <button class="dj-button" id="trashview" title="What is in the trash">Trash</button>
    </div>

    <div class="dj-bar" id="tools">
      <input id="filter" type="search" placeholder="Filter" aria-label="Filter by name (/)" autocomplete="off" />
      <select id="sort" aria-label="Sort by">
        <option value="name">Name</option>
        <option value="size">Size</option>
        <option value="modified">Modified</option>
        <option value="kind">Kind</option>
      </select>
      <button class="dj-button" id="sortdir" aria-label="Ascending">↑</button>
    </div>

    <div
      id="list"
      role="listbox"
      aria-multiselectable="true"
      aria-label="Files"
      tabindex="0"
    ></div>

    <!-- Below the list, not above it: a bar that appears above the rows on
         the first click moves them, and the second click of a double-click
         then lands on a different row. At the bottom it is also where a
         thumb is. -->
    <div class="dj-bar" id="selbar" hidden>
      <span id="selcount">0 selected</span>
      <span class="dj-spacer"></span>
      <button class="dj-button" id="peek" title="Quick Look (Space)">Quick Look</button>
      <button class="dj-button" id="openwith" hidden title="Open in an app" aria-haspopup="menu">Open with…</button>
      <button class="dj-button" id="rename" title="Rename (F2)">Rename</button>
      <button class="dj-button" id="cut" title="Cut, to move (Ctrl+X)">Cut</button>
      <button class="dj-button" id="copy" title="Copy (Ctrl+C)">Copy</button>
      <button class="dj-button" id="trash" title="Move to the trash (Delete)">Trash</button>
      <button class="dj-button" id="restore" hidden title="Put back where it was">Restore</button>
      <button class="dj-button" id="done">Done</button>
    </div>

    <div class="foot">
      <p class="dj-status" id="status">Loading…</p>
      <button class="dj-button" id="keepboth" hidden title="Copy under a new name instead">Keep both</button>
      <button class="dj-button" id="undo" hidden>Undo</button>
      <span id="space" aria-live="polite"></span>
    </div>

    <div id="menu" role="menu" hidden></div>
    <div id="ghost" hidden aria-hidden="true"></div>

    <script type="module">
      import { bus, failure, text } from "/kit/bus.js";
      import { createSelection } from "/kit/selection.js";
      import { shell } from "/kit/shell.js";
      import { mountFiles } from "./files.js";

      mountFiles(document, { bus, shell, createSelection, text, failure });
    </script>
  </body>
</html>
