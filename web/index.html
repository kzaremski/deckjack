    <meta name="color-scheme" content="dark light" />

    <!--
      iOS reads none of the manifest for the home screen. The icon comes from
      `apple-touch-icon` (180x180, opaque and square — iOS masks it itself),
      the name from `apple-mobile-web-app-title`, and standalone mode from
      `apple-mobile-web-app-capable`. `mobile-web-app-capable` is the
      standardized spelling that everything else reads; both are here because
      neither one covers both.

      `black-translucent` puts the shell *under* the status bar, which is only
      correct because `TopBar` pads itself by `env(safe-area-inset-top)`.
      Without that padding this setting hides the bar behind the clock.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deckjack" />
    <link rel="apple-touch-icon" href="/icons/deckjack-180.png" />
    <!-- Stops iOS turning anything in a terminal's output that looks like a
         phone number into a blue tel: link. -->
    <meta name="format-detection" content="telephone=no" />

    <!--
      The first paint happens before any module runs, so the ground color and
      the boot frame are inline. Everything else comes from the generated
      token stylesheet. Getting this wrong is a white flash on every launch of
      an installed PWA, which is exactly the kind of thing that sends me back
      to a native desktop.
    -->
    <meta name="theme-color" content="#161D27" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <style>
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0a0d11;
        color: #e7ecf3;
        font: 14px/1.45 "Space Grotesk", system-ui, sans-serif;
        /* An installed app does not rubber-band. Without this, dragging
           anywhere in iOS standalone peels the whole shell away from the top
           of the screen and shows the background behind it. */
        overscroll-behavior: none;
        /* Safari paints a grey box over every tapped button otherwise, which
           reads as a rendering fault on a dark shell. */
        -webkit-tap-highlight-color: transparent;
      }
      html[data-theme="circuit"] body {
        background: #f3f1ea;
        color: #171a16;
      }
      /* Occupies the same box the bar will, so mounting shifts nothing. The
         bar moved to the top, so this did too: left at the bottom it drew a
         rule under the content and then jumped when Vue mounted. */
      #boot {
        position: fixed;
        inset: 0 0 auto 0;
        height: calc(52px + env(safe-area-inset-top, 0px));
        border-bottom: 1px solid rgba(128, 144, 168, 0.28);
      }
    </style>

  <body>
    <div id="app"><div id="boot" aria-hidden="true"></div></div>
    <noscript>
      Deckjack's shell is a web application: windows, the dock and the command
      palette are all rendered in the browser, so JavaScript has to be enabled.
      The sign-in page works without it.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
