<!doctype html>
<html lang="en" data-theme="night" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Deckjack</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/deckjack.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/deckjack-192.png" />
    <meta name="color-scheme" content="dark light" />
    <!--
      The first paint happens before any module runs, so the ground color and
      the boot frame are inline. Everything else comes from the generated
      token stylesheet. Getting this wrong is a white flash on every launch of
      an installed PWA, which is exactly the kind of thing that sends me back
      to a native desktop.
    -->
    <meta name="theme-color" content="#161D27" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <style>
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0a0d11;
        color: #e7ecf3;
        font: 14px/1.45 "Space Grotesk", system-ui, sans-serif;
      }
      html[data-theme="circuit"] body {
        background: #f3f1ea;
        color: #171a16;
      }
      /* Occupies the same box the dock will, so mounting shifts nothing. */
      #boot {
        position: fixed;
        inset: auto 0 0 0;
        height: 52px;
        border-top: 1px solid rgba(128, 144, 168, 0.28);
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot" aria-hidden="true"></div></div>
    <noscript>
      Deckjack's shell is a web application: windows, the dock and the command
      palette are all rendered in the browser, so JavaScript has to be enabled.
      The sign-in page works without it.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
